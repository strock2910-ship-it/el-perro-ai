
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EL PERRO AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 760px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      width: 100%;
      margin-bottom: 20px;
    }

    h1 {
      color: #ff8c00;
      margin-bottom: 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #bbb;
      font-size: 14px;
    }

    .avatar-container {
      width: 210px;
      height: 210px;
      margin: 10px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
    }

    .status {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }

    .chat {
      width: 100%;
      height: 350px;
      overflow-y: auto;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #303030;
      text-align: right;
      margin-left: 35px;
    }

    .bot {
      background: #292014;
      border-left: 3px solid #ff8c00;
      margin-right: 20px;
    }

    .controls {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      background: #ff8c00;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .extra-controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .extra-controls button {
      background: #333;
      color: white;
      border: 1px solid #555;
    }

    .footer {
      color: #666;
      font-size: 12px;
      margin-top: 25px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .app {
        padding: 12px;
      }

      .chat {
        height: 330px;
      }

      .controls button {
        padding: 12px;
      }

      .avatar-container {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <h1>🐕 EL PERRO AI</h1>
      <div class="subtitle">
        Tu asistente virtual de El Perro Caliente
      </div>
    </header>

    <div class="avatar-container">
      <img
        class="avatar"
        src="https://raw.githubusercontent.com/strock2910-ship-it/el-perro-ai/main/perro-ai.jpeg"
        alt="EL PERRO AI"
      >
    </div>

    <div class="status" id="status">
      Conectando con Google...
    </div>

    <section class="chat" id="chat" aria-live="polite">
      <div class="message bot">
        ¡Qué onda! Soy EL PERRO AI.
        Estoy listo para ayudarte con El Perro Caliente.
        ¿Qué vamos a trabajar hoy?
      </div>
    </section>

    <div class="controls">
      <input
        id="mensaje"
        type="text"
        maxlength="1500"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >
      <button id="enviar" onclick="enviarMensaje()">
        Enviar
      </button>
    </div>

    <div class="extra-controls">
      <button id="microfono" onclick="iniciarMicrofono()">
        🎤 Hablar
      </button>

      <button onclick="detenerVoz()">
        ⏹ Detener voz
      </button>

      <button id="vozBtn" onclick="alternarVoz()">
        🔊 Voz activada
      </button>
    </div>

    <div class="footer">
      EL PERRO AI · El Perro Caliente
    </div>

  </main>

  <script>
    // ==========================================
    // CONFIGURACIÓN
    // ==========================================

    const GOOGLE_URL =
      "https://script.google.com/macros/s/AKfycbxwBmyFNByGO9u-83mkdJlw8OVLjcOJOcUbbsweRejXPhTcLgBAfzPg2Pl86o9cUDx0Bg/exec";

    let historial = [];
    let vozActivada = true;
    let reconociendo = false;
    let reconocimiento = null;

    const chat = document.getElementById("chat");
    const statusTexto = document.getElementById("status");
    const campoMensaje = document.getElementById("mensaje");
    const botonEnviar = document.getElementById("enviar");

    // ==========================================
    // CONEXIÓN CON GOOGLE APPS SCRIPT
    // ==========================================

    function llamarGoogle(parametros) {
      return new Promise((resolve, reject) => {

        const callback =
          "perroAI_" + Date.now() + "_" +
          Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const datos = new URLSearchParams({
          ...parametros,
          callback: callback
        });

        const temporizador = setTimeout(() => {
          limpiar();
          reject(new Error("Tiempo de espera agotado."));
        }, 30000);

        function limpiar() {
          clearTimeout(temporizador);

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          delete window[callback];
        }

        window[callback] = function(resultado) {
          limpiar();
          resolve(resultado);
        };

        script.onerror = function() {
          limpiar();
          reject(new Error("No se pudo conectar con Google."));
        };

        script.src = GOOGLE_URL + "?" + datos.toString();

        document.body.appendChild(script);
      });
    }

    // ==========================================
    // PROBAR CONEXIÓN
    // ==========================================

    async function conectarGoogle() {
      try {
        const respuesta = await llamarGoogle({
          action: "ping"
        });

        if (respuesta && respuesta.correcto) {
          statusTexto.textContent =
            "🟢 Conectado con Google y Gemini";
        } else {
          statusTexto.textContent =
            "No se pudo confirmar la conexión.";
        }

      } catch (error) {
        statusTexto.textContent =
          "🔴 Error de conexión con Google";
        console.error(error);
      }
    }

    // ==========================================
    // MOSTRAR MENSAJES
    // ==========================================

    function agregarMensaje(texto, tipo) {
      const elemento = document.createElement("div");

      elemento.className = "message " + tipo;
      elemento.textContent = texto;

      chat.appendChild(elemento);
      chat.scrollTop = chat.scrollHeight;
    }

    // ==========================================
    // ENVIAR MENSAJE A GEMINI
    // ==========================================

    async function enviarMensaje() {
      const texto = campoMensaje.value.trim();

      if (!texto || botonEnviar.disabled) {
        return;
      }

      agregarMensaje(texto, "user");

      campoMensaje.value = "";
      botonEnviar.disabled = true;

      statusTexto.textContent =
        "🐕 EL PERRO AI está pensando...";

      try {
        const respuesta = await llamarGoogle({
          action: "responder",
          texto: texto,
          historial: JSON.stringify(historial.slice(-6))
        });

        if (!respuesta) {
          throw new Error("Google no devolvió una respuesta.");
        }

        const mensaje =
          respuesta.respuesta ||
          respuesta.texto ||
          respuesta.mensaje ||
          respuesta.text ||
          "";

        if (!mensaje) {
          throw new Error("La respuesta llegó vacía.");
        }

        agregarMensaje(mensaje, "bot");

        historial.push(
          { rol: "user", texto: texto },
          { rol: "assistant", texto: mensaje }
        );

        historial = historial.slice(-12);

        statusTexto.textContent =
          "🟢 EL PERRO AI está listo";

        if (vozActivada) {
          hablar(mensaje);
        }

      } catch (error) {
        console.error(error);

        agregarMensaje(
          "No pude responder en este momento. Intenta nuevamente.",
          "bot"
        );

        statusTexto.textContent =
          "🔴 Error al consultar Gemini";

      } finally {
        botonEnviar.disabled = false;
        campoMensaje.focus();
      }
    }

    campoMensaje.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        enviarMensaje();
      }
    });

    // ==========================================
    // VOZ DEL ASISTENTE
    // ==========================================

    function seleccionarVoz() {
      const voces = speechSynthesis.getVoices();

      const vocesEspanol = voces.filter(voz =>
        voz.lang.toLowerCase().startsWith("es")
      );

      const vozMasculina = vocesEspanol.find(voz =>
        /male|masculino|jorge|diego|pablo|raul|andres/i.test(
          voz.name
        )
      );

      return vozMasculina ||
        vocesEspanol.find(voz =>
          voz.lang.toLowerCase() === "es-mx"
        ) ||
        vocesEspanol[0] ||
        null;
    }

    function hablar(texto) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      speechSynthesis.cancel();

      const mensaje = new SpeechSynthesisUtterance(texto);
      const voz = seleccionarVoz();

      if (voz) {
        mensaje.voice = voz;
      }

      mensaje.lang = voz ? voz.lang : "es-MX";
      mensaje.rate = 0.92;
      mensaje.pitch = 0.85;
      mensaje.volume = 1;

      speechSynthesis.speak(mensaje);
    }

    function detenerVoz() {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }
    }

    function alternarVoz() {
      vozActivada = !vozActivada;

      document.getElementById("vozBtn").textContent =
        vozActivada
          ? "🔊 Voz activada"
          : "🔇 Voz desactivada";

      if (!vozActivada) {
        detenerVoz();
      }
    }

    if ("speechSynthesis" in window) {
      speechSynthesis.onvoiceschanged = function() {
        seleccionarVoz();
      };
    }

    // ==========================================
    // RECONOCIMIENTO DE VOZ
    // ==========================================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      reconocimiento = new SpeechRecognition();

      reconocimiento.lang = "es-MX";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      reconocimiento.onstart = function() {
        reconociendo = true;

        statusTexto.textContent =
          "🎤 Te estoy escuchando...";
      };

      reconocimiento.onresult = function(event) {
        const texto =
          event.results[0][0].transcript;

        campoMensaje.value = texto;
        enviarMensaje();
      };

      reconocimiento.onerror = function(event) {
        console.error(event.error);

        statusTexto.textContent =
          "No pude reconocer tu voz. Intenta nuevamente.";
      };

      reconocimiento.onend = function() {
        reconociendo = false;
      };

    } else {
      document.getElementById("microfono").disabled = true;

      statusTexto.textContent =
        "Tu navegador no admite reconocimiento de voz.";
    }

    function iniciarMicrofono() {
      if (!reconocimiento || reconociendo) {
        return;
      }

      try {
        reconocimiento.start();
      } catch (error) {
        console.error(error);
      }
    }

    // ==========================================
    // INICIAR
    // ==========================================

    conectarGoogle();
  </script>
</body>
</html>
