
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EL PERRO AI</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 850px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 12px;
    }

    header h1 {
      margin: 0;
      color: #ff8c00;
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      color: #ccc;
      margin: 8px 0 0;
    }

    .avatar-container {
      width: 100%;
      height: 330px;
      background: radial-gradient(circle, #292929, #151515);
      border: 1px solid #383838;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    .status {
      text-align: center;
      color: #ffad42;
      font-size: 13px;
      min-height: 18px;
    }

    .chat {
      flex: 1;
      min-height: 220px;
      max-height: 400px;
      overflow-y: auto;
      padding: 15px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .mensaje {
      max-width: 90%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .usuario {
      margin-left: auto;
      background: #b85c00;
      color: white;
    }

    .perro {
      margin-right: auto;
      background: #333;
      color: white;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #252525;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff8c00;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      background: #ff8c00;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #e87900;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: center;
    }

    .controles button {
      flex: 1;
      min-width: 125px;
    }

    .secundario {
      background: #333;
    }

    .secundario:hover {
      background: #484848;
    }

    .activo {
      background: #b83232;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 10px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 12px;
      }

      .avatar-container {
        height: 270px;
      }

      header h1 {
        font-size: 27px;
      }

      .entrada {
        flex-wrap: wrap;
      }

      .entrada input {
        flex-basis: 100%;
      }

      .entrada button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🐕 EL PERRO AI</h1>
    <p>Tu asistente virtual de El Perro Caliente</p>
  </header>

  <div class="avatar-container">
    <model-viewer
      id="avatar"
      src="https://raw.githubusercontent.com/strock2910-ship-it/el-perro-ai/main/perro-ai.glb"
      alt="Mascota de El Perro Caliente"
      camera-controls
      auto-rotate
      rotation-per-second="15deg"
      shadow-intensity="1"
      exposure="1">
    </model-viewer>
  </div>

  <div class="status" id="estado">
    Conectando con EL PERRO AI...
  </div>

  <div class="chat" id="chat">
    <div class="mensaje perro">
      ¡Hola! 🐕 Soy EL PERRO AI. Bienvenido a El Perro Caliente.
      ¿Qué se te antoja hoy?
    </div>
  </div>

  <div class="entrada">
    <input
      id="mensaje"
      type="text"
      placeholder="Escribe tu mensaje..."
      autocomplete="off">

    <button id="btnEnviar" onclick="enviarMensaje()">
      Enviar
    </button>
  </div>

  <div class="controles">
    <button id="btnMicrofono" onclick="escuchar()">
      🎤 Hablar
    </button>

    <button class="secundario" onclick="activarVoz()">
      🔊 Activar voz
    </button>

    <button class="secundario" onclick="detenerVoz()">
      ⏹ Detener
    </button>
  </div>

  <footer>
    EL PERRO AI · El Perro Caliente Tultepec
  </footer>

</div>

<script>
/* =========================================
   CONFIGURACIÓN
========================================= */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxwBmyFNByGO9u-83mkdJlw8OVLjcOJOcUbbsweRejXPhTcLgBAfzPg2Pl86o9cUDx0Bg/exec";

let historial = [];
let reconocimiento = null;
let vozAutomatica = true;
let ultimaRespuesta = "";
let esperandoRespuesta = false;


/* =========================================
   CONEXIÓN CON GOOGLE APPS SCRIPT
========================================= */

function llamarGoogle(parametros) {
  return new Promise((resolve, reject) => {

    const callback =
      "perroCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const url = new URL(URL_APPS_SCRIPT);

    Object.keys(parametros).forEach(clave => {
      url.searchParams.set(clave, parametros[clave]);
    });

    url.searchParams.set("callback", callback);

    const script = document.createElement("script");
    let terminado = false;

    const temporizador = setTimeout(() => {
      finalizar();
      reject(new Error("Tiempo de espera agotado al conectar con Google."));
    }, 45000);

    function finalizar() {
      if (terminado) return;
      terminado = true;

      clearTimeout(temporizador);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      delete window[callback];
    }

    window[callback] = function(resultado) {
      finalizar();
      resolve(resultado);
    };

    script.onerror = function() {
      finalizar();
      reject(new Error("No se pudo conectar con Google."));
    };

    script.src = url.toString();
    document.body.appendChild(script);
  });
}


/* =========================================
   COMPROBAR CONEXIÓN
========================================= */

async function conectarGoogle() {
  const estado = document.getElementById("estado");

  try {
    const respuesta = await llamarGoogle({
      action: "ping"
    });

    if (respuesta && respuesta.correcto) {
      estado.textContent = "🐕 EL PERRO AI está conectado";
      estado.style.color = "#54d67a";
    } else {
      estado.textContent = "No se pudo comprobar la conexión";
    }

  } catch (error) {
    estado.textContent = "Error de conexión con Google";
    console.error(error);
  }
}


/* =========================================
   CHAT
========================================= */

function agregarMensaje(texto, tipo) {
  const chat = document.getElementById("chat");
  const elemento = document.createElement("div");

  elemento.className = "mensaje " + tipo;
  elemento.textContent = texto;

  chat.appendChild(elemento);
  chat.scrollTop = chat.scrollHeight;
}


async function enviarMensaje() {

  if (esperandoRespuesta) return;

  const input = document.getElementById("mensaje");
  const texto = input.value.trim();

  if (!texto) return;

  agregarMensaje(texto, "usuario");

  input.value = "";

  esperandoRespuesta = true;

  document.getElementById("btnEnviar").disabled = true;
  document.getElementById("estado").textContent =
    "🐕 Estoy pensando...";

  try {

    const respuesta = await llamarGoogle({
      action: "responder",
      texto: texto,
      historial: JSON.stringify(historial)
    });

    if (!respuesta) {
      throw new Error("Google no devolvió una respuesta.");
    }

    if (respuesta.correcto === false) {
      throw new Error(
        respuesta.mensaje || "No pude procesar tu mensaje."
      );
    }

    const contenido =
      typeof respuesta === "string"
        ? respuesta
        : respuesta.respuesta ||
          respuesta.texto ||
          respuesta.mensaje ||
          respuesta.response ||
          respuesta.text;

    if (!contenido) {
      throw new Error("La respuesta llegó vacía.");
    }

    ultimaRespuesta = contenido;

    historial.push({
      role: "user",
      parts: [{ text: texto }]
    });

    historial.push({
      role: "model",
      parts: [{ text: contenido }]
    });

    agregarMensaje(contenido, "perro");

    document.getElementById("estado").textContent =
      "🐕 Aquí estoy para ayudarte";

    if (vozAutomatica) {
      hablar(contenido);
    }

  } catch (error) {

    console.error(error);

    agregarMensaje(
      "Disculpa, tuve un problema al responder. Inténtalo nuevamente.",
      "perro"
    );

    document.getElementById("estado").textContent =
      "Problema de conexión";

  } finally {

    esperandoRespuesta = false;
    document.getElementById("btnEnviar").disabled = false;
  }
}


document.getElementById("mensaje").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      enviarMensaje();
    }
  }
);


/* =========================================
   NÚMEROS A PALABRAS
========================================= */

function numeroATexto(numero) {

  numero = Number(numero);

  if (!Number.isFinite(numero)) return String(numero);

  if (numero > 999999999 || numero < 0) {
    return String(numero);
  }

  const unidades = [
    "cero", "uno", "dos", "tres", "cuatro",
    "cinco", "seis", "siete", "ocho", "nueve",
    "diez", "once", "doce", "trece", "catorce",
    "quince", "dieciséis", "diecisiete",
    "dieciocho", "diecinueve", "veinte",
    "veintiuno", "veintidós", "veintitrés",
    "veinticuatro", "veinticinco", "veintiséis",
    "veintisiete", "veintiocho", "veintinueve"
  ];

  const decenas = [
    "", "", "", "treinta", "cuarenta",
    "cincuenta", "sesenta", "setenta",
    "ochenta", "noventa"
  ];

  const centenas = [
    "", "ciento", "doscientos", "trescientos",
    "cuatrocientos", "quinientos", "seiscientos",
    "setecientos", "ochocientos", "novecientos"
  ];

  function menorMil(n) {

    if (n < 30) return unidades[n];

    if (n < 100) {
      const d = Math.floor(n / 10);
      const u = n % 10;

      return u === 0
        ? decenas[d]
        : decenas[d] + " y " + unidades[u];
    }

    if (n === 100) return "cien";

    const c = Math.floor(n / 100);
    const resto = n % 100;

    return centenas[c] +
      (resto ? " " + menorMil(resto) : "");
  }

  function convertir(n) {

    if (n < 1000) return menorMil(n);

    if (n < 1000000) {

      const miles = Math.floor(n / 1000);
      const resto = n % 1000;

      const textoMiles =
        miles === 1
          ? "mil"
          : menorMil(miles) + " mil";

      return textoMiles +
        (resto ? " " + menorMil(resto) : "");
    }

    const millones = Math.floor(n / 1000000);
    const resto = n % 1000000;

    const textoMillones =
      millones === 1
        ? "un millón"
        : convertir(millones) + " millones";

    return textoMillones +
      (resto ? " " + convertir(resto) : "");
  }

  if (Number.isInteger(numero)) {
    return convertir(numero);
  }

  const partes = numero.toString().split(".");
  const entero = convertir(Number(partes[0]));
  const decimal = partes[1]
    .split("")
    .map(d => unidades[Number(d)])
    .join(" ");

  return entero + " punto " + decimal;
}


/* =========================================
   LIMPIAR TEXTO PARA LA VOZ
========================================= */

function limpiarTextoParaVoz(texto) {

  let limpio = String(texto);

  limpio = limpio.replace(
    /https?:\/\/\S+/gi,
    " "
  );

  limpio = limpio.replace(
    /\[([^\]]+)\]\([^)]+\)/g,
    "$1"
  );

  limpio = limpio.replace(
    /[*_~`#]/g,
    ""
  );

  limpio = limpio.replace(
    /\$(\d+(?:\.\d+)?)/g,
    function(match, numero) {
      return numeroATexto(numero) + " pesos";
    }
  );

  limpio = limpio.replace(
    /(\d[\d,]*(?:\.\d+)?)/g,
    function(numero) {
      return numeroATexto(
        Number(numero.replace(/,/g, ""))
      );
    }
  );

  limpio = limpio.replace(
    /\p{Extended_Pictographic}/gu,
    " "
  );

  limpio = limpio.replace(
    /[|•*_#~`=<>[\]{}]/g,
    " "
  );

  limpio = limpio.replace(
    /[ \t]+/g,
    " "
  );

  limpio = limpio.replace(
    /\n{2,}/g,
    ". "
  );

  return limpio.trim();
}


/* =========================================
   SELECCIÓN DE VOZ NATURAL
========================================= */

function seleccionarVoz() {

  const voces = speechSynthesis.getVoices();

  if (!voces.length) return null;

  const vocesEspanolMexico = voces.filter(voz =>
    voz.lang.toLowerCase() === "es-mx"
  );

  const vocesEspanol = voces.filter(voz =>
    voz.lang.toLowerCase().startsWith("es")
  );

  const candidatas =
    vocesEspanolMexico.length
      ? vocesEspanolMexico
      : vocesEspanol;

  if (!candidatas.length) return null;

  // Preferir una voz española de mejor integración con Chrome.
  const vozGoogle = candidatas.find(voz =>
    /google/i.test(voz.name)
  );

  if (vozGoogle) return vozGoogle;

  const vozNatural = candidatas.find(voz =>
    /natural|neural|online/i.test(voz.name)
  );

  if (vozNatural) return vozNatural;

  return candidatas[0];
}


/* =========================================
   HABLAR CON VOZ MÁS NATURAL
========================================= */

function hablar(texto) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  const textoLimpio = limpiarTextoParaVoz(texto);

  if (!textoLimpio) return;

  speechSynthesis.cancel();

  const mensaje = new SpeechSynthesisUtterance(
    textoLimpio
  );

  const voz = seleccionarVoz();

  mensaje.lang = voz ? voz.lang : "es-MX";

  if (voz) {
    mensaje.voice = voz;
  }

  // Ajustes suaves para evitar una voz artificial.
  mensaje.rate = 0.96;
  mensaje.pitch = 1.0;
  mensaje.volume = 1;

  mensaje.onstart = function() {
    document.getElementById("estado").textContent =
      "🐕 EL PERRO AI está hablando...";
  };

  mensaje.onend = function() {
    document.getElementById("estado").textContent =
      "🐕 Aquí estoy para ayudarte";
  };

  mensaje.onerror = function(event) {
    console.error("Error de voz:", event);
    document.getElementById("estado").textContent =
      "No se pudo reproducir la voz";
  };

  speechSynthesis.speak(mensaje);
}


function activarVoz() {
  vozAutomatica = true;

  if (ultimaRespuesta) {
    hablar(ultimaRespuesta);
  }

  document.getElementById("estado").textContent =
    "Voz activada";
}


function detenerVoz() {
  speechSynthesis.cancel();

  document.getElementById("estado").textContent =
    "Voz detenida";
}


/* =========================================
   RECONOCIMIENTO DE VOZ
========================================= */

function prepararMicrofono() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("estado").textContent =
      "Tu navegador no admite reconocimiento de voz";
    return;
  }

  reconocimiento = new SpeechRecognition();

  reconocimiento.lang = "es-MX";
  reconocimiento.continuous = false;
  reconocimiento.interimResults = false;

  reconocimiento.onstart = function() {
    document.getElementById("btnMicrofono").classList.add("activo");

    document.getElementById("estado").textContent =
      "🎤 Te estoy escuchando...";
  };

  reconocimiento.onresult = function(event) {

    const texto =
      event.results[0][0].transcript;

    document.getElementById("mensaje").value = texto;

    enviarMensaje();
  };

  reconocimiento.onerror = function(event) {

    console.error("Error de micrófono:", event.error);

    document.getElementById("estado").textContent =
      "Error de voz: " + event.error;

    document.getElementById("btnMicrofono").classList.remove("activo");
  };

  reconocimiento.onend = function() {
    document.getElementById("btnMicrofono").classList.remove("activo");
  };
}


function escuchar() {

  if (!reconocimiento) {
    prepararMicrofono();
  }

  if (!reconocimiento) return;

  try {
    reconocimiento.start();
  } catch (error) {
    console.error(error);
  }
}


/* =========================================
   INICIAR EL ASISTENTE
========================================= */

window.addEventListener("load", function() {

  prepararMicrofono();
  conectarGoogle();

  // Cargar voces disponibles del navegador.
  if ("speechSynthesis" in window) {
    speechSynthesis.getVoices();

    speechSynthesis.onvoiceschanged = function() {
      seleccionarVoz();
    };
  }

});
</script>

</body>
</html>
