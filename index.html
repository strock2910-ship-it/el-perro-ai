
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EL PERRO AI</title>

  <!-- Visor de modelos 3D -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 760px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ff8c00;
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 15px;
    }

    .avatar-container {
      width: 100%;
      max-width: 390px;
      height: 360px;
      background: radial-gradient(circle, #303030, #151515);
      border: 1px solid #444;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    .status {
      color: #ffb347;
      font-size: 13px;
      margin: 12px;
      text-align: center;
    }

    .chat {
      width: 100%;
      margin-top: 15px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 15px;
    }

    #messages {
      height: 260px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 11px 14px;
      border-radius: 12px;
      max-width: 90%;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user {
      background: #343434;
      align-self: flex-end;
    }

    .bot {
      background: #633600;
      align-self: flex-start;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #292929;
      color: white;
      font-size: 15px;
    }

    button {
      padding: 12px 15px;
      border: none;
      border-radius: 10px;
      background: #ff8c00;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .secondary {
      background: #333;
      color: white;
    }

    .voice-controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .footer {
      color: #777;
      font-size: 12px;
      margin-top: 18px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .avatar-container { height: 310px; }
      .controls { flex-wrap: wrap; }
      .controls input { flex-basis: 100%; }
      .controls button { flex: 1; }
    }
  </style>
</head>

<body>
  <main class="app">

    <h1>🐕 EL PERRO AI</h1>
    <div class="subtitle">Tu asistente inteligente</div>

    <div class="avatar-container">
      <model-viewer
        id="avatar"
        src="https://raw.githubusercontent.com/strock2910-ship-it/el-perro-ai/main/perro-ai.glb"
        alt="Mascota 3D de EL PERRO AI"
        camera-controls
        auto-rotate
        rotation-per-second="15deg"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        interaction-prompt="auto"
        loading="eager">
      </model-viewer>
    </div>

    <div class="status" id="connectionStatus">
      Conectando con Google...
    </div>

    <section class="chat">
      <div id="messages">
        <div class="message bot">
          ¡Hola! Soy EL PERRO AI. ¿En qué puedo ayudarte?
        </div>
      </div>

      <div class="controls">
        <input
          id="userInput"
          type="text"
          maxlength="1500"
          placeholder="Escribe tu mensaje..."
          autocomplete="off">

        <button id="sendButton" onclick="enviarMensaje()">
          Enviar
        </button>
      </div>

      <div class="voice-controls">
        <button class="secondary" id="micButton" onclick="iniciarMicrofono()">
          🎤 Hablar
        </button>

        <button class="secondary" id="voiceButton" onclick="alternarVoz()">
          🔊 Voz activada
        </button>

        <button class="secondary" onclick="detenerVoz()">
          ⏹ Detener voz
        </button>
      </div>
    </section>

    <div class="footer">
      EL PERRO AI · El Perro Caliente
    </div>

  </main>

  <script>
    const GOOGLE_URL =
      "https://script.google.com/macros/s/AKfycbxwBmyFNByGO9u-83mkdJlw8OVLjcOJOcUbbsweRejXPhTcLgBAfzPg2Pl86o9cUDx0Bg/exec";

    let historial = [];
    let vozActivada = true;
    let voces = [];
    let reconocimiento = null;

    const messages = document.getElementById("messages");
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const status = document.getElementById("connectionStatus");
    const voiceButton = document.getElementById("voiceButton");

    function agregarMensaje(texto, tipo) {
      const div = document.createElement("div");
      div.className = "message " + tipo;
      div.textContent = texto;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function llamarGoogle(parametros) {
      return new Promise((resolve, reject) => {
        const callback =
          "perroAI_" + Date.now() + "_" +
          Math.random().toString(36).slice(2);

        const script = document.createElement("script");
        const datos = new URLSearchParams(parametros);

        datos.set("callback", callback);

        const timeout = setTimeout(() => {
          limpiar();
          reject(new Error("Tiempo de espera agotado al conectar con Google."));
        }, 30000);

        function limpiar() {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        window[callback] = (respuesta) => {
          limpiar();
          resolve(respuesta);
        };

        script.onerror = () => {
          limpiar();
          reject(new Error("No se pudo conectar con Google."));
        };

        script.src = GOOGLE_URL + "?" + datos.toString();
        document.body.appendChild(script);
      });
    }

    async function conectarGoogle() {
      try {
        const respuesta = await llamarGoogle({
          action: "ping"
        });

        if (respuesta.correcto) {
          status.textContent = "🟢 Conectado con Google";
        } else {
          status.textContent = "⚠️ Revisa la conexión con Google";
        }
      } catch (error) {
        status.textContent = "🔴 Sin conexión con Google";
        console.error(error);
      }
    }

    async function enviarMensaje() {
      const texto = input.value.trim();

      if (!texto || sendButton.disabled) return;

      agregarMensaje(texto, "user");
      input.value = "";
      sendButton.disabled = true;
      status.textContent = "EL PERRO AI está pensando...";

      try {
        const respuesta = await llamarGoogle({
          action: "responder",
          texto: texto,
          historial: JSON.stringify(historial.slice(-6))
        });

        if (!respuesta || !respuesta.texto) {
          throw new Error("Google no devolvió una respuesta válida.");
        }

        const respuestaTexto = respuesta.texto;

        agregarMensaje(respuestaTexto, "bot");

        historial.push(
          { role: "user", content: texto },
          { role: "assistant", content: respuestaTexto }
        );

        historial = historial.slice(-12);

        if (vozActivada) hablar(respuestaTexto);

        status.textContent = "🟢 EL PERRO AI está listo";

      } catch (error) {
        console.error(error);
        agregarMensaje(
          "No pude conectarme en este momento. Intenta nuevamente.",
          "bot"
        );
        status.textContent = "⚠️ Error de conexión";
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") enviarMensaje();
    });

    function cargarVoces() {
      voces = speechSynthesis.getVoices();
    }

    if ("speechSynthesis" in window) {
      cargarVoces();
      speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function hablar(texto) {
      if (!("speechSynthesis" in window)) return;

      speechSynthesis.cancel();

      const mensaje = new SpeechSynthesisUtterance(texto);
      mensaje.lang = "es-MX";
      mensaje.rate = 0.92;
      mensaje.pitch = 0.85;
      mensaje.volume = 1;

      const voz =
        voces.find(v =>
          /es-MX/i.test(v.lang) && /male|masculino/i.test(v.name)
        ) ||
        voces.find(v => /es-MX/i.test(v.lang)) ||
        voces.find(v => /^es/i.test(v.lang));

      if (voz) mensaje.voice = voz;

      speechSynthesis.speak(mensaje);
    }

    function alternarVoz() {
      vozActivada = !vozActivada;

      voiceButton.textContent = vozActivada
        ? "🔊 Voz activada"
        : "🔇 Voz desactivada";

      if (!vozActivada) speechSynthesis.cancel();
    }

    function detenerVoz() {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }
    }

    function iniciarMicrofono() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Tu navegador no permite reconocimiento de voz. Prueba con Chrome.");
        return;
      }

      if (reconocimiento) {
        reconocimiento.stop();
      }

      reconocimiento = new SpeechRecognition();
      reconocimiento.lang = "es-MX";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      reconocimiento.onstart = () => {
        status.textContent = "🎤 Te estoy escuchando...";
      };

      reconocimiento.onresult = (event) => {
        input.value = event.results[0][0].transcript;
        enviarMensaje();
      };

      reconocimiento.onerror = (event) => {
        status.textContent = "No se pudo utilizar el micrófono";
        console.error(event.error);
      };

      reconocimiento.onend = () => {
        if (status.textContent === "🎤 Te estoy escuchando...") {
          status.textContent = "🟢 EL PERRO AI está listo";
        }
      };

      reconocimiento.start();
    }

    const avatar = document.getElementById("avatar");

    avatar.addEventListener("load", () => {
      status.textContent = "🐕 Modelo 3D cargado · Conectando con Google...";
    });

    avatar.addEventListener("error", (event) => {
      console.error("Error al cargar el modelo 3D", event);
      status.textContent = "⚠️ No se pudo cargar el modelo 3D";
    });

    conectarGoogle();
  </script>
</body>
</html>
