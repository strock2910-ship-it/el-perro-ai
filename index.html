
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EL PERRO AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 760px;
      min-height: 100vh;
      margin: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 15px;
    }

    h1 {
      color: #ff8a00;
      letter-spacing: 2px;
      margin: 5px;
    }

    header p {
      color: #aaa;
      font-size: 14px;
    }

    .mascota {
      height: 245px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .marco-perro {
      width: 210px;
      height: 210px;
      border-radius: 25px;
      overflow: hidden;
      border: 3px solid #ff8a00;
      box-shadow: 0 0 30px #ff8a0066;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #perro {
      width: 200%;
      height: 200%;
      object-fit: cover;
      transform: translate(-25%, -18%);
      transition: transform .2s, filter .2s;
    }

    #perro.hablando {
      animation: pulso .65s infinite alternate;
      filter: brightness(1.15);
    }

    @keyframes pulso {
      from {
        transform: translate(-25%, -18%) scale(1);
      }
      to {
        transform: translate(-25%, -18%) scale(1.07);
      }
    }

    #chat {
      flex: 1;
      min-height: 280px;
      max-height: 48vh;
      overflow-y: auto;
      background: #1d1d1d;
      border: 1px solid #383838;
      border-radius: 15px;
      padding: 12px;
    }

    .mensaje {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .usuario {
      background: #653900;
      margin-left: 12%;
    }

    .asistente {
      background: #303030;
      margin-right: 12%;
    }

    #estado {
      text-align: center;
      color: #ffb347;
      font-size: 13px;
      padding: 12px;
      min-height: 40px;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: #ff8a00;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .acciones {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .acciones button {
      flex: 1;
      min-width: 100px;
      background: #333;
      color: white;
      border: 1px solid #555;
    }

    .acciones button:hover {
      background: #653900;
    }

    .acciones button.activo {
      background: #653900;
      border-color: #ff8a00;
      color: #ffb347;
    }

    @media(max-width: 480px) {
      .app { padding: 10px; }
      .entrada button { padding: 10px; }
      .acciones button { font-size: 12px; }
    }
  </style>
</head>

<body>

<main class="app">

  <header>
    <h1>EL PERRO AI</h1>
    <p>Tu asistente virtual de El Perro Caliente</p>
  </header>

  <section class="mascota">
    <div class="marco-perro">
      <img
        id="perro"
        src="https://raw.githubusercontent.com/strock2910-ship-it/el-perro-ai/main/perro-ai.png"
        alt="EL PERRO AI, nuestro perro salchicha"
        onerror="this.style.display='none'; document.getElementById('respaldo').style.display='block';">
      <span id="respaldo" style="display:none;font-size:80px;">🐶</span>
    </div>
  </section>

  <section id="chat" aria-live="polite">
    <div class="mensaje asistente">
      ¡Qué onda! Soy EL PERRO AI.
      Estoy listo para ayudarte con El Perro Caliente.
      ¿Qué vamos a trabajar hoy?
    </div>
  </section>

  <div id="estado">Conectando con Google...</div>

  <div class="entrada">
    <input
      id="mensaje"
      type="text"
      placeholder="Escribe tu mensaje..."
      autocomplete="off">

    <button id="enviar" type="button">Enviar</button>
  </div>

  <div class="acciones">
    <button id="microfono" type="button">🎤 Hablar</button>
    <button id="vozAutomatica" type="button" class="activo">
      🔊 Voz automática: SÍ
    </button>
    <button id="escuchar" type="button">▶ Escuchar</button>
    <button id="detener" type="button">⏹ Detener</button>
  </div>

</main>

<script>
  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbxwBmyFNByGO9u-83mkdJlw8OVLjcOJOcUbbsweRejXPhTcLgBAfzPg2Pl86o9cUDx0Bg/exec';

  const chat = document.getElementById('chat');
  const entrada = document.getElementById('mensaje');
  const estado = document.getElementById('estado');
  const botonEnviar = document.getElementById('enviar');
  const botonMicrofono = document.getElementById('microfono');
  const botonVozAutomatica = document.getElementById('vozAutomatica');
  const perro = document.getElementById('perro');

  let historial = [];
  let ultimaRespuesta = '';
  let reconocimientoActivo = null;
  let conectado = false;
  let contador = 0;
  let vozAutomatica = true;
  let vocesDisponibles = [];

  // Cargar voces del navegador
  function cargarVoces() {
    if (!window.speechSynthesis) return;
    vocesDisponibles = speechSynthesis.getVoices();
  }

  cargarVoces();

  if (window.speechSynthesis) {
    speechSynthesis.onvoiceschanged = cargarVoces;
  }

  // Buscar voz en español
  function seleccionarVoz() {
    cargarVoces();

    const vocesEspanol = vocesDisponibles.filter(function(voz) {
      return voz.lang && voz.lang.toLowerCase().startsWith('es');
    });

    const masculina = vocesEspanol.find(function(voz) {
      return /male|masculino|hombre|jorge|diego|pablo/i.test(voz.name);
    });

    return masculina ||
      vocesEspanol.find(function(voz) {
        return voz.lang.toLowerCase() === 'es-mx';
      }) ||
      vocesEspanol[0] ||
      null;
  }

  function agregarMensaje(texto, clase) {
    const div = document.createElement('div');
    div.className = 'mensaje ' + clase;
    div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  // Comunicación con Google Apps Script mediante JSONP
  function llamarGoogle(parametros) {
    return new Promise(function(resolve, reject) {

      const nombreCallback = 'perroAI_' + (++contador);
      const script = document.createElement('script');

      const consulta = new URLSearchParams({
        ...parametros,
        callback: nombreCallback
      });

      let terminado = false;

      function limpiar() {
        if (terminado) return;
        terminado = true;
        delete window[nombreCallback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        clearTimeout(limite);
      }

      const limite = setTimeout(function() {
        limpiar();
        reject(new Error('Google tardó demasiado en responder.'));
      }, 25000);

      window[nombreCallback] = function(resultado) {
        limpiar();

        if (!resultado || !resultado.correcto) {
          reject(new Error(
            resultado && resultado.error
              ? resultado.error
              : 'Respuesta no válida de Google.'
          ));
          return;
        }

        resolve(resultado);
      };

      script.onerror = function() {
        limpiar();
        reject(new Error('No se pudo cargar la respuesta de Google.'));
      };

      script.src = URL_APPS_SCRIPT + '?' + consulta.toString();
      document.head.appendChild(script);
    });
  }

  // Conectar con Google
  async function conectarGoogle() {
    estado.textContent = 'Conectando con Google...';

    try {
      const resultado = await llamarGoogle({
        action: 'ping'
      });

      conectado = true;
      estado.textContent = resultado.mensaje || 'Conectado con Google';

    } catch (error) {
      conectado = false;
      estado.textContent = 'Error de conexión: ' + error.message;
    }
  }

  // Hablar respuesta
  function hablar(texto) {
    if (!window.speechSynthesis || !texto) {
      estado.textContent = 'La reproducción de voz no está disponible.';
      return;
    }

    speechSynthesis.cancel();

    const voz = new SpeechSynthesisUtterance(texto);
    const seleccion = seleccionarVoz();

    voz.lang = seleccion ? seleccion.lang : 'es-MX';
    voz.rate = 0.92;
    voz.pitch = 0.85;
    voz.volume = 1;

    if (seleccion) {
      voz.voice = seleccion;
    }

    voz.onstart = function() {
      perro.classList.add('hablando');
      estado.textContent = '🐶 EL PERRO AI está hablando...';
    };

    voz.onend = function() {
      perro.classList.remove('hablando');
      estado.textContent = 'EL PERRO AI está en línea';
    };

    voz.onerror = function() {
      perro.classList.remove('hablando');
      estado.textContent = 'No se pudo reproducir la voz.';
    };

    speechSynthesis.speak(voz);
  }

  // Enviar mensaje a Gemini
  async function enviarMensaje() {
    const texto = entrada.value.trim();

    if (!texto || botonEnviar.disabled) return;

    if (!conectado) {
      estado.textContent = 'Todavía no hay conexión con Google.';
      return;
    }

    if (texto.length > 1500) {
      estado.textContent = 'El mensaje es demasiado largo. Resume tu consulta.';
      return;
    }

    if (window.speechSynthesis) {
      speechSynthesis.cancel();
      perro.classList.remove('hablando');
    }

    agregarMensaje(texto, 'usuario');
    entrada.value = '';

    botonEnviar.disabled = true;
    estado.textContent = 'EL PERRO AI está pensando...';

    try {
      const historialEnviar = historial.slice(-6);

      const resultado = await llamarGoogle({
        action: 'responder',
        texto: texto,
        historial: JSON.stringify(historialEnviar)
      });

      const respuesta = String(resultado.respuesta || 'No recibí respuesta.');

      agregarMensaje(respuesta, 'asistente');

      historial.push(
        { role: 'user', content: texto },
        { role: 'model', content: respuesta }
      );

      historial = historial.slice(-10);
      ultimaRespuesta = respuesta;

      estado.textContent = 'EL PERRO AI está en línea';

      if (vozAutomatica) {
        hablar(respuesta);
      }

    } catch (error) {
      agregarMensaje('Error: ' + error.message, 'asistente');
      estado.textContent = 'Error de comunicación con Google';
    }

    botonEnviar.disabled = false;
    entrada.focus();
  }

  botonEnviar.addEventListener('click', enviarMensaje);

  entrada.addEventListener('keydown', function(evento) {
    if (evento.key === 'Enter') {
      enviarMensaje();
    }
  });

  // Micrófono
  function escuchar() {
    const Reconocimiento =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!Reconocimiento) {
      estado.textContent = 'Chrome no admite reconocimiento de voz.';
      return;
    }

    if (reconocimientoActivo) return;

    if (window.speechSynthesis) {
      speechSynthesis.cancel();
      perro.classList.remove('hablando');
    }

    const reconocimiento = new Reconocimiento();
    reconocimientoActivo = reconocimiento;
    reconocimiento.lang = 'es-MX';
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;

    reconocimiento.onstart = function() {
      estado.textContent = 'Te estoy escuchando...';
      botonMicrofono.textContent = '🎙 Escuchando...';
    };

    reconocimiento.onresult = function(evento) {
      const texto = evento.results[0][0].transcript;

      entrada.value = texto;
      reconocimientoActivo = null;
      botonMicrofono.textContent = '🎤 Hablar';

      enviarMensaje();
    };

    reconocimiento.onerror = function(evento) {
      estado.textContent = 'Error de voz: ' + evento.error;
      reconocimientoActivo = null;
      botonMicrofono.textContent = '🎤 Hablar';
    };

    reconocimiento.onend = function() {
      reconocimientoActivo = null;
      botonMicrofono.textContent = '🎤 Hablar';
    };

    try {
      reconocimiento.start();
    } catch (error) {
      estado.textContent = 'No se pudo iniciar el micrófono.';
      reconocimientoActivo = null;
      botonMicrofono.textContent = '🎤 Hablar';
    }
  }

  botonMicrofono.addEventListener('click', escuchar);

  // Activar o desactivar voz automática
  botonVozAutomatica.addEventListener('click', function() {
    vozAutomatica = !vozAutomatica;

    botonVozAutomatica.textContent = vozAutomatica
      ? '🔊 Voz automática: SÍ'
      : '🔇 Voz automática: NO';

    botonVozAutomatica.classList.toggle('activo', vozAutomatica);

    if (!vozAutomatica && window.speechSynthesis) {
      speechSynthesis.cancel();
      perro.classList.remove('hablando');
      estado.textContent = 'Voz automática desactivada';
    } else {
      estado.textContent = 'Voz automática activada';
    }
  });

  // Escuchar última respuesta
  document.getElementById('escuchar')
    .addEventListener('click', function() {
      if (!ultimaRespuesta) {
        estado.textContent = 'Todavía no hay una respuesta para escuchar.';
        return;
      }

      hablar(ultimaRespuesta);
    });

  // Detener todo
  function detenerTodo() {
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
    }

    if (reconocimientoActivo) {
      reconocimientoActivo.abort();
      reconocimientoActivo = null;
    }

    perro.classList.remove('hablando');
    botonMicrofono.textContent = '🎤 Hablar';

    estado.textContent = conectado
      ? 'EL PERRO AI está en línea'
      : 'Conectando con Google...';
  }

  document.getElementById('detener')
    .addEventListener('click', detenerTodo);

  // Iniciar aplicación
  conectarGoogle();
</script>

</body>
</html>
